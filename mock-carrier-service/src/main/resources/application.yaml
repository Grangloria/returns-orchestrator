server:
  port: ${SERVER_PORT:8003}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:always}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}

carrier:
  name: ${CARRIER_NAME:Grangloria Freight}
  simulator:
    transit-delay-seconds: ${CARRIER_SIMULATOR_TRANSIT_DELAY_SECONDS:5}

kafka:
  topics:
    # Consumed Events
    return-label-ready: ${KAFKA_TOPIC_RETURN_LABEL_READY:returns.label.ready.v1}
    # Produced Events
    package-received: ${KAFKA_TOPIC_PACKAGE_RECEIVED:returns.package.received.v1}

spring:
  application:
    name: carrier-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:carrier-simulator-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES:*}
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.returns.common.event.ReturnLabelReadyEvent"

  main:
    web-application-type: reactive

# Springdoc OpenAPI / Swagger UI Configuration
