server:
  port: ${SERVER_PORT:8006}

spring:
  application:
    name: refund-service

  r2dbc:
    url: r2dbc:mssql://${DB_HOST:localhost}:${DB_PORT:1433}/${DB_NAME:refund_db}
    username: ${DB_USER:sa}
    password: ${DB_PASS:YourStrongPassword123!} # Match the SA password defined in your docker-compose file

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: refund-service-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.returns.common.event"

kafka:
  topics:
    inventory-restocked: ${KAFKA_TOPIC_INVENTORY_RESTOCKED:returns.inventory.restocked.v1}
    refund-completed: ${KAFKA_TOPIC_REFUND_COMPLETED:returns.refund.completed.v1}