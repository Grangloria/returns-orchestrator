server:
  port: ${SERVER_PORT:8006}

kafka:
  topics:
    # Consumed Events
    inventory-restocked: ${KAFKA_TOPIC_INVENTORY_RESTOCKED:returns.inventory.restocked.v1}
    # Produced Events
    refund-completed: ${KAFKA_TOPIC_REFUND_COMPLETED:returns.refund.completed.v1}

spring:
  application:
    name: refund-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: refund-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.returns.common.event"

logging:
  level:
    root: INFO
    com.returns.refund: DEBUG
  file:
    name: "logs/refund-service.log"