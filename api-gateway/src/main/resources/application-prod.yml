spring:
  # Disable Redis auto-configuration in production
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false

  # Overwrite the routes to remove the Redis-dependent RateLimiter filters
  cloud:
    gateway:
      routes:
        - id: returns-service-route
          uri: http://returns-service.returns-orchestrator-cluster-prod.local:8000
          predicates:
            - Path=/api/v1/returns/**

        - id: inventory-service-route
          uri: http://inventory-service.returns-orchestrator-cluster-prod.local:8001
          predicates:
            - Path=/api/v1/inventory/**

management:
  tracing:
    enabled: false