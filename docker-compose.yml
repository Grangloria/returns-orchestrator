services:
  # =============== MOCK MAILER SERVER ==============
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - returns-network

  redis:
    image: redis:7-alpine
    container_name: returns-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - returns-network

  # =============== SQL SERVER ==============
  sql-server:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: returns-sql-server
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASS}
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - returns-network

  # =============== SQL SERVER INITIALIZER ==============
  sql-server-init:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: returns-sql-server-init
    depends_on:
      sql-server:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "SQL Server is online. Verifying catalog schemas..."
        /opt/mssql-tools18/bin/sqlcmd -S sql-server -U ${DB_USER:-sa} -P "${DB_PASS}" -C -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'returns_db') CREATE DATABASE returns_db;"
        /opt/mssql-tools18/bin/sqlcmd -S sql-server -U ${DB_USER:-sa} -P "${DB_PASS}" -C -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'inventory_db') CREATE DATABASE inventory_db;"
        /opt/mssql-tools18/bin/sqlcmd -S sql-server -U ${DB_USER:-sa} -P "${DB_PASS}" -C -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'refund_db') CREATE DATABASE refund_db;"
        echo "Databases verified/created successfully."

  # =============== ZOOKEEPER ==============
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: returns-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - returns-network

  # =============== KAFKA ==============
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: returns-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - returns-network

  # =============== KAFKA WEB DASHBOARD ==============
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: returns-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: returns-orchestrator-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - returns-network

  # =============== MICROSERVICES STACK (APPS PROFILE) ==============

  api-gateway:
    profiles: ["apps"]
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: returns-api-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RETURNS_SERVICE_HOST=returns-service
      - INVENTORY_SERVICE_HOST=inventory-service
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - returns-network

  returns-service:
    profiles: ["apps"]
    build:
      context: ./returns-service
      dockerfile: Dockerfile
    container_name: returns-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=sql-server
      - DB_PORT=1433
      - DB_NAME=returns_db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      sql-server-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - returns-network

  inventory-service:
    profiles: ["apps"]
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: returns-inventory-service
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=sql-server
      - DB_PORT=1433
      - DB_NAME=inventory_db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      sql-server-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - returns-network

  refund-service:
    profiles: ["apps"]
    build:
      context: ./refund-service
      dockerfile: Dockerfile
    container_name: returns-refund-service
    ports:
      - "8006:8006"
    environment:
      - DB_HOST=sql-server
      - DB_PORT=1433
      - DB_NAME=refund_db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      sql-server-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - returns-network

  notification-service:
    profiles: ["apps"]
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: returns-notification-service
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      - kafka
      - mailpit
    networks:
      - returns-network

  carrier-service:
    profiles: ["apps"]
    build:
      context: ./carrier-service
      dockerfile: Dockerfile
    container_name: returns-carrier-service
    ports:
      - "8003:8003"
    networks:
      - returns-network

  carrier-gateway:
    profiles: ["apps"]
    build:
      context: ./carrier-gateway
      dockerfile: Dockerfile
    container_name: returns-carrier-gateway
    ports:
      - "8004:8004"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CARRIER_SERVICE_URL=http://carrier-service:8003
    depends_on:
      kafka:
        condition: service_started
      carrier-service:
        condition: service_started
    networks:
      - returns-network

  mock-carrier-simulator:
    profiles: ["apps"]
    build:
      context: ./mock-carrier-simulator
      dockerfile: Dockerfile
    container_name: returns-mock-carrier-simulator
    ports:
      - "8005:8005"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - returns-network

  # =============== APACHE CASSANDRA ==============
  cassandra:
    image: cassandra:latest
    container_name: returns-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=returns-cassandra-cluster
      - CASSANDRA_DC=datacenter1
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - returns-network

  # =============== APACHE SPARK ==============
  spark-master:
    image: apache/spark:3.5.5
    container_name: returns-spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8085:8080"
      - "7077:7077"
    networks:
      - returns-network

  spark-worker:
    image: apache/spark:3.5.5
    container_name: returns-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8086:8081"
    networks:
      - returns-network

  # ====== OBSERVABILITY STACK ======

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-local
    restart: unless-stopped
    ports:
      - "8081:8080"   # Host 8081 -> Container 8080
      - "50000:50000" # Build agent port
    volumes:
      - jenkins-data:/var/jenkins_home
    networks:
      - returns-network

  prometheus:
    image: prom/prometheus:latest
    container_name: returns-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules
    depends_on:
      - kafka
    networks:
      - returns-network

  grafana:
    image: grafana/grafana:latest
    container_name: returns-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - returns-network

  loki:
    image: grafana/loki:2.9.4
    container_name: returns-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - returns-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: returns-promtail
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
    depends_on:
      - loki
    networks:
      - returns-network

  # =============== KEYCLOAK IDENTITY PROVIDER ==============
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: returns-keycloak
    command: start-dev
    ports:
      - "8082:8080" # Host 8082 -> Container 8080 (avoids collision with gateway on 8080)
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    networks:
      - returns-network

volumes:
  mssql-data:
  cassandra-data:
  jenkins-data:

networks:
  returns-network:
    driver: bridge