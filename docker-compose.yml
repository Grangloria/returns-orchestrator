version: '3.8'

services:
  # =============== SQL SERVER ==============
  sql-server:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: returns-sql-server
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-Hayeja123!}
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    #Uses a generic bash network check because sqlcmd doesn't exist in this ARM64 image
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # =============== SQL SERVER INITIALIZER ==============
  sql-server-init:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: returns-sql-server-init
    depends_on:
      sql-server:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "SQL Server is online. Verifying catalog schema..."
        /opt/mssql-tools18/bin/sqlcmd -S sql-server -U sa -P "Hayeja123!" -C -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'returns_db') CREATE DATABASE returns_db;"
        echo "Database returns_db verified/created successfully. Shutting down initializer daemon."

  # =============== ZOOKEEPER - Cluster Management ==============
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: returns-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"


  # =============== KAFKA - Event Stream ==============
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: returns-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # =============== APACHE CASSANDRA ==============
  cassandra:
    image: cassandra:latest
    container_name: returns-cassandra
    ports:
      - "9042:9042"  # CQL native transport port
    environment:
      - CASSANDRA_CLUSTER_NAME=returns-cassandra-cluster
      - CASSANDRA_DC=datacenter1
    volumes:
      - cassandra-data:/var/lib/cassandra

  # =============== APACHE SPARK (MASTER) ==============
  spark-master:
    image: apache/spark:3.5.5
    container_name: returns-spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8085:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master internal port

  # =============== APACHE SPARK (WORKER) ==============
  spark-worker:
    image: apache/spark:3.5.5
    container_name: returns-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8086:8081"  # Spark Worker Web UI

  # ====== OBSERVABILITY STACK ======
  prometheus:
    image: prom/prometheus:latest
    container_name: returns-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    # wait for kafka to be ready
    depends_on:
      - kafka

  grafana:
    image: grafana/grafana:latest
    container_name: returns-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.4
    container_name: returns-promtail
    volumes:
      # routes the centralized log collection to the container
      - ./logs:/var/log/apps
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  mssql-data:
  cassandra-data: