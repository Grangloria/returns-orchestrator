version: '3.8'

services:
  # =============== SQL SERVER ==============
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: returns-sql-server
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:Hayeja123!}
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    # health check to verify SQL Server is ready
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Hayeja123!", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =============== SQL SERVER INITIALIZER ==============
  sql-server-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: returns-sql-server-init
    depends_on:
      sql-server:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "SQL Server is online. Verifying catalog schema..."
        /opt/mssql-tools18/bin/sqlcmd -S sql-server -U sa -P "Hayeja123!" -C -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'returns_db') CREATE DATABASE returns_db;"
        echo "Database returns_db verified/created successfully. Shutting down initializer daemon."

  # =============== ZOOKEEPER - Cluster Management ==============
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: returns-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"


  # =============== KAFKA - Event Stream ==============
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: returns-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ====== OBSERVABILITY STACK ======
  prometheus:
    image: prom/prometheus:latest
    container_name: returns-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    # wait for kafka to be ready
    depends_on:
      - kafka

  grafana:
    image: grafana/grafana:latest
    container_name: returns-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.4
    container_name: returns-promtail
    volumes:
      # routes the centralized log collection to the container
      - ./logs:/var/log/apps
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  mssql-data: