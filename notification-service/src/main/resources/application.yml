server:
  port: ${SERVER_PORT:8002}

kafka:
  topics:
    return-label-ready: returns.label.ready.v1

spring:
  application:
    name: notification-service
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.grangloria.*"
        spring.json.type.mapping: "com.grangloria.gateway.event.ReturnLabelReadyEvent:com.grangloria.notification.event.ReturnLabelReadyEvent"

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: "logs/notification-service.log"