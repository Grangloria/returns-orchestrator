server:
  port: ${SERVER_PORT:8004}

kafka:
  topics:
    # Consumed Events
    return-initiated: ${KAFKA_TOPIC_RETURN_INITIATED:returns.order.initiated.v1}
    # Produced Events
    return-label-ready: ${KAFKA_TOPIC_RETURN_LABEL_READY:returns.label.ready.v1}

spring:
  application:
    name: carrier-gateway

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: carrier-gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.returns.common.event"

logging:
  level:
    root: INFO
    com.returns.gateway: DEBUG
  file:
    name: "logs/carrier-gateway.log"

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    defaults:
      enabled: false
    kafka:
      enabled: false

carrier:
  client:
    base-url: ${CARRIER_SERVICE_URL:http://localhost:8003}
    connect-timeout-ms: 3000
    read-timeout-ms: 3000