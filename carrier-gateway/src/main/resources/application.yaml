server:
  port: ${SERVER_PORT:8004}

kafka:
  topics:
    return-initiated: ${KAFKA_TOPIC_RETURN_INITIATED:returns.order.initiated.v1}
    return-label-ready: ${KAFKA_TOPIC_RETURN_LABEL_READY:returns.label.ready.v1}

spring:
  application:
    name: carrier-gateway

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:carrier-gateway-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.returns.common.event.ReturnInitiatedEvent"

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.returns.gateway: ${LOGGING_LEVEL_GATEWAY:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    defaults:
      enabled: true

carrier:
  client:
    base-url: ${CARRIER_SERVICE_URL:http://localhost:8003}
    connect-timeout-ms: ${CARRIER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CARRIER_READ_TIMEOUT_MS:3000}