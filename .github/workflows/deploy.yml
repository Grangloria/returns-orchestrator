name: CI/CD Pipeline - AWS ECS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECS_CLUSTER: returns-orchestrator-cluster-prod
  PORTAL_SERVICE: customer-portal-service
  GATEWAY_SERVICE: api-gateway-service
  ECR_REGISTRY: 594116288585.dkr.ecr.us-east-2.amazonaws.com

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  # -------------------------------------------------------------
  # Stage 1: Build, Unit/Testcontainers Testing & SAST Scan
  # -------------------------------------------------------------
  test-and-analyze:
    name: Gradle Tests & SonarQube SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for SonarQube analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Executes unit tests and LocalStack/Kafka Testcontainers integration tests
      - name: Execute Gradle Tests & Build
        run: ./gradlew clean build test --info

      # Preserve compiled JAR for the Docker build stage
      - name: Upload API Gateway Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/build/libs/api-gateway-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: SonarQube SAST Code Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

  # -------------------------------------------------------------
  # Stage 2: Docker Multi-Stage Build & Push to Amazon ECR
  # -------------------------------------------------------------
  build-and-publish:
    name: Build & Push Docker Images
    needs: test-and-analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download API Gateway Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/build/libs

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::594116288585:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Customer Portal Image
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/customer-portal:${{ github.sha }}"
          docker build -t "$IMAGE_URI" -t "${{ env.ECR_REGISTRY }}/customer-portal:latest" ./customer-portal
          docker push "$IMAGE_URI"
          docker push "${{ env.ECR_REGISTRY }}/customer-portal:latest"

      - name: Build and Push API Gateway Image
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/api-gateway:${{ github.sha }}"
          docker build -t "$IMAGE_URI" -t "${{ env.ECR_REGISTRY }}/api-gateway:latest" ./api-gateway
          docker push "$IMAGE_URI"
          docker push "${{ env.ECR_REGISTRY }}/api-gateway:latest"

  # -------------------------------------------------------------
  # Stage 3: Rolling Deployments to AWS ECS Fargate
  # -------------------------------------------------------------
  deploy-fargate:
    name: Deploy to ECS Fargate
    needs: build-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::594116288585:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # Download the active task definitions from AWS
      - name: Download Active Task Definitions
        run: |
          aws ecs describe-task-definition --task-definition customer-portal-prod --query taskDefinition > task-def-portal.json
          aws ecs describe-task-definition --task-definition api-gateway-prod --query taskDefinition > task-def-gateway.json

      # Inject newly published image tags directly
      - name: Render Portal Task Definition
        id: render-portal
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-portal.json
          container-name: customer-portal
          image: ${{ env.ECR_REGISTRY }}/customer-portal:${{ github.sha }}

      - name: Render Gateway Task Definition
        id: render-gateway
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-gateway.json
          container-name: api-gateway
          image: ${{ env.ECR_REGISTRY }}/api-gateway:${{ github.sha }}

      # Trigger rolling update with zero downtime
      - name: Deploy Customer Portal to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-portal.outputs.task-definition }}
          service: ${{ env.PORTAL_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy API Gateway to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-gateway.outputs.task-definition }}
          service: ${{ env.GATEWAY_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true