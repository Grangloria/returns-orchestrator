name: Returns Service CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 21 with automated Gradle caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Ensure Gradle Wrapper executable bit is set
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Step 1: Run fast Service Unit Tests first
      - name: Run Service Unit Tests
        run: ./gradlew :returns-service:test --tests "com.grangloria.returns.service.*"

      # 5. Step 2: Run Full Test Suite across returns-service
      - name: Run Full Test Suite
        run: ./gradlew :returns-service:test

      # Carrier Service
    # - name: Test Carrier Service
    #   run: ./gradlew :carrier-service:test

      # Inventory Service
    # - name: Test Inventory Service
    #   run: ./gradlew :inventory-service:test

      # Notification Service
    # - name: Test Notification Service
    #   run: ./gradlew :notification-service:test

      # 6. Step 3: Upload JUnit HTML Test Reports as CI Artifacts
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: returns-service/build/reports/tests/test/