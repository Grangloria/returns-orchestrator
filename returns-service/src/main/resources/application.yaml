server:
  port: ${SERVER_PORT:8000}

# Root-level custom property block matching @Value("${kafka.topics...}")
kafka:
  topics:
    # Produced Events
    return-initiated: returns.order.initiated.v1
    return-inventory: returns.inventory.update.v1

    # Consumed Events
    return-completed: returns.order.completed.v1
    return-label-generated: returns.label.generated.v1
    return-label-ready: returns.label.ready.v1

spring:
  application:
    name: return-service

  r2dbc:
    url: "r2dbc:mssql://localhost:1433/returns_db?encrypt=true&trustServerCertificate=true"
    username: sa
    password: ${DB_PASSWORD:Hayeja123!}
    pool:
      initial-size: 5
      max-size: 20

  sql:
    init:
      mode: always
      separator: ";"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: return-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.grangloria.returns.event,com.grangloria.returns.dto,com.grangloria.gateway.event"

logging:
  level:
    root: INFO
    org.springframework.data.r2dbc: DEBUG
    com.grangloria.returns: DEBUG
  file:
    name: "logs/return-service.log"

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    defaults:
      enabled: false
    kafka:
      enabled: false