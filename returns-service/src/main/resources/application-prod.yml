server:
  port: 8000

aws:
  region: ${AWS_REGION:us-east-2}
  s3:
    bucket: ${S3_BUCKET_NAME:returns-evidence-photos-prod-855eb843}
    bucket-name: ${S3_BUCKET_NAME:returns-evidence-photos-prod-855eb843}
    endpoint: ""

app:
  outbox:
    enabled: false

spring:
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false

  datasource:
    host: ${DB_HOST:sqlserver.returns-orchestrator-cluster-prod.local}
    port: 1433
    name: returns_db

  r2dbc:
    url: r2dbc:mssql://${DB_HOST:sqlserver.returns-orchestrator-cluster-prod.local}:1433/returns_db?encrypt=true&trustServerCertificate=true
    username: sa
    password: ${DB_PASS:ProdPass123!}

management:
  tracing:
    enabled: false
  health:
    defaults:
      enabled: false
    r2dbc:
      enabled: false