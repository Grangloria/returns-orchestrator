server:
  port: 8000

aws:
  region: ${AWS_REGION:us-east-2}
  s3:
    bucket-name: ${S3_BUCKET_NAME:returns-evidence-photos-prod-855eb843}

spring:
  # Disable Flyway migrations in AWS production
  flyway:
    enabled: false

  # Let KafkaAutoConfiguration run so KafkaProperties exists,
  # but disable listener containers from trying to connect on startup
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false

  # Fallback datasource settings so Spring context initializes without crashing
  datasource:
    host: localhost
    port: 1433
    name: returns_db

  r2dbc:
    url: r2dbc:mssql://localhost:1433/returns_db?encrypt=true&trustServerCertificate=true
    username: sa
    password: ${DB_PASS:dummy-prod-pass}

management:
  tracing:
    enabled: false
  health:
    defaults:
      enabled: false