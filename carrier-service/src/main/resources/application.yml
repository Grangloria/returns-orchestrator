server:
  port: 8081

spring:
  application:
    name: carrier-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: carrier-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jhayes.returns.*"
        spring.json.type.mapping: "com.jhayes.returns.domain.model.ReturnInitiatedEvent:com.jhayes.returns.event.ReturnInitiatedEvent"
management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name} # This is automatically added by Spring Boot
  health:
    defaults:
      enabled: false
    kafka:
      enabled: false

logging:
  file:
    name: "logs/carrier-service.log"